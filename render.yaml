services:
  # Backend API
  - type: web
    name: clinics-pro-backend
    runtime: node
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clinics-db
          property: connectionString
      - key: PORT
        value: 4000
    healthCheckPath: /

  # PostgreSQL Database
databases:
  - name: clinics-db
    databaseName: clinic_whatsapp
    user: clinic_user
